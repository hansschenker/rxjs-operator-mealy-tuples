name: Validate Mealy baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the reference Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Record environment and revision
        run: |
          {
            git rev-parse HEAD
            node --version
            npm --version
            python3 --version
            uname -sr
            sha256sum package-lock.json
          } | tee "$RUNNER_TEMP/mealy-environment.txt"
      - name: Verify a clean locked installation
        # No bootstrap/update fallback: a missing or inconsistent lockfile fails.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all
          ./node_modules/.bin/tsc --version
          git diff --exit-code -- package.json package-lock.json
      - name: Run every existing check
        run: npm run check 2>&1 | tee "$RUNNER_TEMP/mealy-check.txt"
      - name: Regenerate and check for drift
        run: |
          npm run generate
          git diff --exit-code -- generated
          npm run check 2>&1 | tee "$RUNNER_TEMP/mealy-final-check.txt"
      - name: Package the validated source snapshot
        # Exclude dependencies and Git authentication/configuration metadata.
        run: tar --exclude=./.git --exclude=./node_modules -czf "$RUNNER_TEMP/mealy-source.tar.gz" .
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mealy-validation-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mealy-environment.txt
            ${{ runner.temp }}/mealy-check.txt
            ${{ runner.temp }}/mealy-final-check.txt
            ${{ runner.temp }}/mealy-source.tar.gz
