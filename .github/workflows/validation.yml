name: Validate Mealy baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the reference Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Record environment and revision
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          python3 --version
          uname -sr
      - name: Bootstrap the missing F00 lockfile
        # Temporary bootstrap for the previously unlocked baseline.
        # No write credentials or automatic repository commit are used.
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --ignore-scripts --no-audit --no-fund
          fi
          echo F00_LOCKFILE_BEGIN
          cat package-lock.json
          echo F00_LOCKFILE_END
          sha256sum package-lock.json
      - name: Verify a clean locked installation
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all
          ./node_modules/.bin/tsc --version
      - name: Run every existing check
        run: npm run check
      - name: Regenerate and check for drift
        run: |
          npm run generate
          git diff --exit-code -- generated
          npm run check
